name: Live integration tests

# The live suite talks to a real GitHub repository. It skips itself when the
# credentials are absent, which is safe but silent — this suite already rotted
# once against an API change and nothing noticed until someone ran it by hand.
# A weekly run turns that silence into a failed build.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch: # and on demand

permissions:
  contents: read

jobs:
  live:
    name: Live GitHub tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check for credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CONTROLZ_GITHUB_TOKEN }}
          REPO: ${{ vars.CONTROLZ_TEST_REPO }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$REPO" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live tests are not configured. Add the CONTROLZ_GITHUB_TOKEN secret and the CONTROLZ_TEST_REPO variable to enable them — see .github/workflows/live.yml."
          fi

      - name: Run the live suite
        if: steps.creds.outputs.ready == 'true'
        env:
          CONTROLZ_GITHUB_TOKEN: ${{ secrets.CONTROLZ_GITHUB_TOKEN }}
          CONTROLZ_TEST_REPO: ${{ vars.CONTROLZ_TEST_REPO }}
        run: pytest -m live -v

      - name: Confirm the suite did not silently skip
        if: steps.creds.outputs.ready == 'true'
        env:
          CONTROLZ_GITHUB_TOKEN: ${{ secrets.CONTROLZ_GITHUB_TOKEN }}
          CONTROLZ_TEST_REPO: ${{ vars.CONTROLZ_TEST_REPO }}
        # A skipped live suite passes, which is exactly the failure mode this
        # workflow exists to catch. Fail if nothing actually ran.
        run: |
          COUNT=$(pytest -m live --collect-only -q 2>/dev/null | grep -c "::" || true)
          echo "collected $COUNT live tests"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::The live suite collected 0 tests — it skipped instead of running."
            exit 1
          fi
