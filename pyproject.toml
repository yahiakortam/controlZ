[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlz"
version = "0.1.0"
description = "A transaction/rollback layer for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yahia Kortam", email = "luzzy.kortam@gmail.com" }]
keywords = ["ai", "agents", "rollback", "undo", "transactions", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.7",
    "rich>=13.7",
    "textual>=0.60",
    "PyGithub>=2.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/yahiakortam/controlZ"
Issues = "https://github.com/yahiakortam/controlZ/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/controlz"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["controlz", "fakes"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: talks to a real GitHub repo; needs CONTROLZ_GITHUB_TOKEN and CONTROLZ_TEST_REPO",
]
